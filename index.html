<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" id="meta-description" content="">

    <title id="page-title"></title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="icon" type="image/png" href="imagens/favicon.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="container header-content">

            <h1 id="empresa-nome"></h1>

            <nav class="nav" id="nav">

                <a id="link-inicio" href="#">Início</a>
                <a id="link-sobre" href="#">Sobre</a>
                <a id="link-servicos" href="#">Serviços</a>
                <a id="link-diferenciais" href="#">Diferenciais</a>
                <a id="link-contato" href="#">Contato</a>

            </nav>

            <a href="#" class="header-button" id="header-contato">
                Solicitar orçamento
            </a>

            <button class="menu-button" id="menu-button" aria-label="Abrir menu">
                ☰
            </button>

        </div>

    </header>


    <main>

        <!-- =========================
             HERO
        ========================== -->

        <section class="hero" id="inicio">

            <div class="container hero-content">

                <div class="hero-text">

                    <span class="hero-tag" id="hero-tag"></span>

                    <h1 id="empresa-slogan"></h1>

                    <p id="hero-descricao"></p>

                    <div class="hero-buttons">

                        <a href="#" class="button button-primary" id="hero-botao-principal"></a>

                        <a href="#" class="button button-secondary" id="hero-botao-secundario"></a>

                    </div>

                </div>

                <div class="hero-image">

                    <img id="hero-imagem" src="" alt="">

                </div>

            </div>

        </section>


        <!-- =========================
             SOBRE
        ========================== -->

        <section class="about section" id="sobre">

            <div class="container about-content">

                <div class="about-image">

                    <img id="sobre-imagem" src="" alt="">

                </div>

                <div class="about-text">

                    <span class="section-tag" id="sobre-tag"></span>

                    <h2 id="sobre-titulo"></h2>

                    <p id="sobre-texto-1"></p>

                    <p id="sobre-texto-2"></p>

                    <a href="#" class="text-link" id="sobre-contato">
                        Fale conosco →
                    </a>

                </div>

            </div>

        </section>


        <!-- =========================
             SERVIÇOS
        ========================== -->

        <section class="services section" id="servicos">

            <div class="container">

                <div class="section-header">

                    <span class="section-tag" id="servicos-tag"></span>

                    <h2 id="servicos-titulo"></h2>

                    <p id="servicos-descricao"></p>

                </div>

                <div class="services-grid" id="services-grid"></div>

            </div>

        </section>


        <!-- =========================
             DIFERENCIAIS
        ========================== -->

        <section class="advantages section" id="diferenciais">

            <div class="container">

                <div class="section-header">

                    <span class="section-tag" id="diferenciais-tag"></span>

                    <h2 id="diferenciais-titulo"></h2>

                </div>

                <div class="advantages-grid" id="advantages-grid"></div>

            </div>

        </section>


        <!-- =========================
             CTA
        ========================== -->

        <section class="cta section" id="contato">

            <div class="container cta-content">

                <div class="cta-text">

                    <span class="section-tag" id="cta-tag"></span>

                    <h2 id="cta-titulo"></h2>

                    <p id="cta-descricao"></p>

                    <div class="cta-address">

                        <span class="address-icon">📍</span>

                        <span id="empresa-endereco"></span>

                    </div>

                </div>

                <a id="whatsapp-cta" href="#" target="_blank" rel="noopener noreferrer"
                    class="button button-primary"></a>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        <div class="container footer-content">

            <div>
                <a href="#" class="logo footer-logo" id="footer-logo">
                    <span id="footer-nome"></span><span class="footer-dot"> .</span>
                </a>

                <p id="footer-descricao"></p>
            </div>


            <div class="footer-links">
                <a id="footer-inicio" href="#">Início</a>
                <a id="footer-sobre" href="#">Sobre</a>
                <a id="footer-servicos" href="#">Serviços</a>
                <a id="footer-contato" href="#">Contato</a>
            </div>


            <div class="footer-contact">

                <a id="instagram-footer" href="#" target="_blank" rel="noopener noreferrer">
                    Instagram
                </a>

                <a id="whatsapp-footer" href="#" target="_blank">
                    WhatsApp
                </a>

            </div>

        </div>


        <div class="footer-bottom">

            <div class="footer-copy">

                <p>
                    © <span id="ano"></span>
                    <span id="footer-copyright"></span>
                </p>

            </div>

            <div class="footer-developer">

                <p id="footer-desenvolvedor"></p>

                <div class="developer-links">

                    <a id="developer-whatsapp" href="#" target="_blank" rel="noopener noreferrer">
                        <svg viewBox="0 0 32 32" aria-hidden="true">
                            <path
                                d="M16 3C8.82 3 3 8.82 3 16c0 2.29.6 4.44 1.73 6.31L3.5 28.5l6.32-1.66A12.94 12.94 0 0 0 16 29c7.18 0 13-5.82 13-13S23.18 3 16 3Zm0 23.7c-2.06 0-4.08-.55-5.84-1.59l-.42-.25-3.75.98 1-3.65-.27-.43A10.72 10.72 0 1 1 16 26.7Zm5.87-8.03c-.32-.16-1.9-.94-2.2-1.05-.3-.11-.52-.16-.74.16-.22.32-.85 1.05-1.04 1.27-.19.22-.38.24-.7.08-.32-.16-1.34-.49-2.55-1.56-.94-.84-1.57-1.87-1.75-2.19-.18-.32-.02-.49.14-.65.14-.14.32-.38.48-.57.16-.19.22-.32.32-.54.11-.22.05-.41-.03-.57-.08-.16-.74-1.78-1.01-2.44-.27-.64-.54-.55-.74-.56h-.63c-.22 0-.57.08-.87.41-.3.32-1.14 1.11-1.14 2.71s1.17 3.14 1.33 3.36c.16.22 2.3 3.51 5.57 4.92.78.34 1.39.54 1.86.69.78.25 1.49.21 2.05.13.63-.09 1.9-.78 2.17-1.54.27-.76.27-1.41.19-1.54-.08-.14-.3-.22-.62-.38Z" />
                        </svg>

                        <span>WhatsApp</span>
                    </a>


                    <a id="developer-instagram" href="#" target="_blank" rel="noopener noreferrer">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2Zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm5.25-3.25a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5Z" />
                        </svg>

                        <span>Instagram</span>

                    </a>


                    <a id="developer-portfolio" href="#" target="_blank" rel="noopener noreferrer">

                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42L17.59 5H14V3ZM5 5h6v2H7v10h10v-4h2v6H5V5Z" />
                        </svg>

                        <span>Portfólio</span>

                    </a>

                </div>

            </div>

        </div>

        </div>

    </footer>

    <a id="whatsapp-float" href="#" target="_blank" rel="noopener noreferrer" aria-label="Falar pelo WhatsApp">

        <svg viewBox="0 0 32 32" aria-hidden="true">
            <path
                d="M16 3C8.82 3 3 8.82 3 16c0 2.29.6 4.44 1.73 6.31L3.5 28.5l6.32-1.66A12.94 12.94 0 0 0 16 29c7.18 0 13-5.82 13-13S23.18 3 16 3Zm0 23.7c-2.06 0-4.08-.55-5.84-1.59l-.42-.25-3.75.98 1-3.65-.27-.43A10.72 10.72 0 1 1 16 26.7Zm5.87-8.03c-.32-.16-1.9-.94-2.2-1.05-.3-.11-.52-.16-.74.16-.22.32-.85 1.05-1.04 1.27-.19.22-.38.24-.7.08-.32-.16-1.34-.49-2.55-1.56-.94-.84-1.57-1.87-1.75-2.19-.18-.32-.02-.49.14-.65.14-.14.32-.38.48-.57.16-.19.22-.32.32-.54.11-.22.05-.41-.03-.57-.08-.16-.74-1.78-1.01-2.44-.27-.64-.54-.55-.74-.56h-.63c-.22 0-.57.08-.87.41-.3.32-1.14 1.11-1.14 2.71s1.17 3.14 1.33 3.36c.16.22 2.3 3.51 5.57 4.92.78.34 1.39.54 1.86.69.78.25 1.49.21 2.05.13.63-.09 1.9-.78 2.17-1.54.27-.76.27-1.41.19-1.54-.08-.14-.3-.22-.62-.38Z" />
        </svg>

    </a>

    <script src="config.js"></script>
    <script src="script.js"></script>

</body>

</html>
